image: node:18

stages:
  - install
  - build
  - deploy

cache:
  paths:
    - node_modules/

# ---------------- INSTALL ----------------
install_dependencies:
  stage: install
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

# ---------------- BUILD ----------------
build_react:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - build/
  only:
    - main

# ---------------- DEPLOY ----------------
deploy_production:
  stage: deploy
  image: alpine
  dependencies:
    - build_react
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete build/ $SSH_USER@$SSH_HOST:$DEPLOY_PATH
  only:
    - main